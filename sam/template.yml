AWSTemplateFormatVersion: '2010-09-09'
Transform:
  - AWS::LanguageExtensions
  - AWS::Serverless-2016-10-31

Description: Stack SAM for the pokedex-gauvain domain.

Parameters:
  UserPoolArnParameter:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /pokedex-gauvain/auth/user-pool-arn
    Description: SSM Parameter path containing the Cognito User Pool ARN

  AllowedHeaders:
    Type: String
    Description: CORS allowed headers for API Gateway
  AllowedOrigins:
    Type: String
    Description: CORS allowed origins for API Gateway
  ApiGatewayAccessLogFormat:
    Type: String
    Description: Format in which API Gateway Access Logs are written to CloudWatch
  ApiGatewayDomainName:
    Type: String
    Default: ''
    Description: Custom domain name for API Gateway (leave empty to skip base path mapping)
  ApiName:
    Type: String
    Description: Name of the API Gateway REST API
  ApiPathName:
    Type: String
    Description: Base path segment for API URLs
  ApiStageName:
    Type: String
    Description: Deployment stage name for API Gateway
  DataDeletionPolicy:
    Type: String
    Description: Politique de suppression des données
    Default: Retain
    AllowedValues:
      - Retain
      - Delete
  LambdaLogRetentionDays:
    Type: Number
    Description: Number of days to retain Lambda function logs
    Default: 30
  LoggerLevel:
    Description: Niveau de log applicatif des Lambdas
    Type: String
    Default: INFO
    AllowedValues:
      - DEBUG
      - INFO
      - WARN
      - ERROR
  MinifyingEnabled:
    Type: String
    Description: Enables minifying of Lambda code
    Default: 'true'
  NodeVersion:
    Type: String
    Description: Node.js version for all Lambda functions
    Default: nodejs24.x
    AllowedValues:
      - nodejs22.x
      - nodejs24.x

Conditions:
  IsDomainNameSet: !Not
    - !Equals
      - !Ref ApiGatewayDomainName
      - ''

Globals:
  Function:
    Architectures: [arm64]
    CodeUri: ../src/
    Environment:
      Variables:
        ALLOWED_ORIGINS: !Ref AllowedOrigins
        AWS_NODEJS_CONNECTION_REUSE_ENABLED: 1
        NODE_OPTIONS: '--enable-source-maps'
    Handler: index.handler
    Layers: [!Ref DependenciesLayer]
    LoggingConfig:
      ApplicationLogLevel: !Ref LoggerLevel
      LogFormat: JSON
      SystemLogLevel: INFO
    Runtime: !Ref NodeVersion
    MemorySize: 512
    Timeout: 30
    Tracing: Active

Resources:
  DependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    DeletionPolicy: Delete
    Properties:
      CompatibleRuntimes:
        - !Ref NodeVersion
      ContentUri: ../dist/layer
      RetentionPolicy: Delete
      LayerName: !Sub ${AWS::StackName}-DependenciesLayer

  PokemonTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: !Ref DataDeletionPolicy
    UpdateReplacePolicy: !Ref DataDeletionPolicy
    Properties:
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: garance:backup-plan
          Value: dynamo
        - Key: garance:cloudformation:stack-name
          Value: !Ref AWS::StackName

  PokedexGauvainApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Ref ApiName
      StageName: !Ref ApiStageName
      TracingEnabled: true
      EndpointConfiguration:
        Type: REGIONAL
      AccessLogSetting:
        DestinationArn: !GetAtt PokedexGauvainApiAccessLogGroup.Arn
        Format: !Ref ApiGatewayAccessLogFormat
      Auth:
        Authorizers:
          CognitoM2MAuthorizer:
            # Récupération de l'ARN depuis le paramètre SSM
            UserPoolArn: !Ref UserPoolArnParameter
      Cors:
        AllowHeaders: !Sub "'${AllowedHeaders}'"
        AllowMethods: "'POST,GET,PUT,DELETE'"
        AllowOrigin: !Sub "'${AllowedOrigins}'"
        MaxAge: "'600'"
      GatewayResponses:
        UNAUTHORIZED:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
          ResponseTemplates:
            application/json: '{"message": $context.error.messageString}'
          StatusCode: '401'
      MethodSettings:
        - DataTraceEnabled: false
          HttpMethod: '*'
          LoggingLevel: INFO
          MetricsEnabled: true
          ResourcePath: /*
          ThrottlingBurstLimit: 200
          ThrottlingRateLimit: 100

  PokedexGauvainApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      RetentionInDays: 365
      Tags:
        - Key: garance:cloudformation:stack-name
          Value: !Ref AWS::StackName

  PokedexGauvainBasePathMapping:
    Type: AWS::ApiGateway::BasePathMapping
    Condition: IsDomainNameSet
    Properties:
      BasePath: !Sub '${ApiPathName}/${ApiStageName}'
      DomainName: !Ref ApiGatewayDomainName
      RestApiId: !Ref PokedexGauvainApi
      Stage: !Ref PokedexGauvainApi.Stage

  GetPokemonLambda:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - adapters/primary/serverless/get-pokemon-list.ts
        Minify: !Ref MinifyingEnabled
        Target: es2024
        Sourcemap: inline
        Format: esm
        OutExtension:
          - .js=.mjs
        External:
          - '@aws-sdk/*'
          - '@aws-lambda-powertools/*'
          - '@garance-retraite/*'
          - '@aws-smithy/*'
          - '@smithy/*'
          - 'aws-lambda'
          - 'inversify'
          - 'reflect-metadata'
          - 'zod'
    Properties:
      Handler: get-pokemon-list.handler
      Environment:
        Variables:
          POKEMON_TABLE_NAME: !Ref PokemonTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PokemonTable
      Events:
        GetPokemon:
          Type: Api
          Properties:
            RestApiId: !Ref PokedexGauvainApi
            Path: /pokemons
            Method: GET
            Auth:
              Authorizer: CognitoM2MAuthorizer
              AuthorizationScopes:
                - api.pokedex.m2m/read

  GetUsersLambda:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - adapters/primary/serverless/get-users-list.ts
        Minify: !Ref MinifyingEnabled
        Target: es2024
        Sourcemap: inline
        Format: esm
        OutExtension:
          - .js=.mjs
        External:
          - '@aws-sdk/*'
          - '@aws-lambda-powertools/*'
          - '@garance-retraite/*'
          - '@aws-smithy/*'
          - '@smithy/*'
          - 'aws-lambda'
          - 'inversify'
          - 'reflect-metadata'
          - 'zod'
    Properties:
      Handler: get-users-list.handler
      Environment:
        Variables:
          POKEMON_TABLE_NAME: !Ref PokemonTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PokemonTable
      Events:
        GetUsers:
          Type: Api
          Properties:
            RestApiId: !Ref PokedexGauvainApi
            Path: /users
            Method: GET
            Auth:
              Authorizer: CognitoM2MAuthorizer
              AuthorizationScopes:
                - api.pokedex.m2m/read

  RegisterPurchaseLambda:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - adapters/primary/serverless/register-purchase.ts
        Minify: !Ref MinifyingEnabled
        Target: es2024
        Sourcemap: inline
        Format: esm
        OutExtension:
          - .js=.mjs
        External:
          - '@aws-sdk/*'
          - '@aws-lambda-powertools/*'
          - '@garance-retraite/*'
          - '@aws-smithy/*'
          - '@smithy/*'
          - 'aws-lambda'
          - 'inversify'
          - 'reflect-metadata'
          - 'zod'
    Properties:
      Handler: register-purchase.handler
      Environment:
        Variables:
          POKEMON_TABLE_NAME: !Ref PokemonTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PokemonTable
      Events:
        RegisterPurchase:
          Type: Api
          Properties:
            RestApiId: !Ref PokedexGauvainApi
            Path: /users/{userId}/purchases
            Method: POST
            Auth:
              Authorizer: CognitoM2MAuthorizer
              AuthorizationScopes:
                - api.pokedex.m2m/write

  CreatePokemonLambda:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - adapters/primary/serverless/create-pokemon.ts
        Minify: !Ref MinifyingEnabled
        Target: es2024
        Sourcemap: inline
        Format: esm
        OutExtension:
          - .js=.mjs
        External:
          - '@aws-sdk/*'
          - '@aws-lambda-powertools/*'
          - '@garance-retraite/*'
          - '@aws-smithy/*'
          - '@smithy/*'
          - 'aws-lambda'
          - 'inversify'
          - 'reflect-metadata'
          - 'zod'
    Properties:
      Handler: create-pokemon.handler
      Environment:
        Variables:
          POKEMON_TABLE_NAME: !Ref PokemonTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PokemonTable
      Events:
        CreatePokemon:
          Type: Api
          Properties:
            RestApiId: !Ref PokedexGauvainApi
            Path: /pokemons
            Method: POST
            Auth:
              Authorizer: CognitoM2MAuthorizer
              AuthorizationScopes:
                - api.pokedex.m2m/write

  CreateUserLambda:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - adapters/primary/serverless/create-user.ts
        Minify: !Ref MinifyingEnabled
        Target: es2024
        Sourcemap: inline
        Format: esm
        OutExtension:
          - .js=.mjs
        External:
          - '@aws-sdk/*'
          - '@aws-lambda-powertools/*'
          - '@garance-retraite/*'
          - '@aws-smithy/*'
          - '@smithy/*'
          - 'aws-lambda'
          - 'inversify'
          - 'reflect-metadata'
          - 'zod'
    Properties:
      Handler: create-user.handler
      Environment:
        Variables:
          POKEMON_TABLE_NAME: !Ref PokemonTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PokemonTable
      Events:
        CreatePokemon: # Note: l'ID d'Event s'appelait CreatePokemon mais cible /users dans ton template
          Type: Api
          Properties:
            RestApiId: !Ref PokedexGauvainApi
            Path: /users
            Method: POST
            Auth:
              Authorizer: CognitoM2MAuthorizer
              AuthorizationScopes:
                - api.pokedex.m2m/write

  CreateUserLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${CreateUserLambda}
      RetentionInDays: !Ref LambdaLogRetentionDays

Outputs:
  PokedexGauvainApiEndpointUrl:
    Description: API Endpoint (custom domain)
    Condition: IsDomainNameSet
    Value: !Sub https://${ApiGatewayDomainName}/${ApiPathName}/${ApiStageName}
  PokedexGauvainApiExecuteUrl:
    Description: API execute URL
    Value: !Sub ${PokedexGauvainApi}.execute-api.${AWS::Region}.amazonaws.com
  PokedexGauvainApiId:
    Description: API ID
    Value: !Ref PokedexGauvainApi
  PokemonTableName:
    Description: DynamoDB Pokemon table name
    Value: !Ref PokemonTable
