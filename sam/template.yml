AWSTemplateFormatVersion: '2010-09-09'
Transform:
  - AWS::LanguageExtensions
  - AWS::Serverless-2016-10-31

Description: Stack pokedex-gauvain badges.

Parameters:
  Env:
    Type: String
    Default: dev
    Description: Env name (dev, prod, test)
  DataDeletionPolicy:
    Type: String
    Description: Politique de suppression des données
    Default: Retain
    AllowedValues:
      - Retain
      - Delete
  AllowedHeaders:
    Type: String
    Default: 'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'
    Description: CORS allowed headers for API Gateway
  AllowedOrigins:
    Type: String
    Default: '*'
    Description: CORS allowed origins for API Gateway
  ApiName:
    Type: String
    Default: PokedexBadgeApi
    Description: Name of the API Gateway REST API
  ApiStageName:
    Type: String
    Default: prod
    Description: Deployment stage name for API Gateway
  LoggerLevel:
    Description: Niveau de log applicatif des Lambdas
    Type: String
    Default: INFO
    AllowedValues:
      - DEBUG
      - INFO
      - WARN
      - ERROR
  MinifyingEnabled:
    Type: String
    Description: Enables minifying of Lambda code
    Default: 'true'
  NodeVersion:
    Type: String
    Description: Node.js version for all Lambda functions
    Default: nodejs24.x
    AllowedValues:
      - nodejs22.x
      - nodejs24.x
  LambdaLogRetentionDays:
    Type: Number
    Description: Number of days to retain Lambda function logs
    Default: 30

Globals:
  Function:
    Architectures: [arm64]
    CodeUri: ../src/
    Environment:
      Variables:
        ALLOWED_ORIGINS: !Ref AllowedOrigins
        AWS_NODEJS_CONNECTION_REUSE_ENABLED: 1
        NODE_OPTIONS: '--enable-source-maps'
    Handler: index.handler
    Layers: [!Ref DependenciesLayer]
    LoggingConfig:
      ApplicationLogLevel: !Ref LoggerLevel
      LogFormat: JSON
      SystemLogLevel: INFO
    Runtime: !Ref NodeVersion
    MemorySize: 512
    Timeout: 30
    Tracing: Active

Resources:
  UserBadgeTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: !Ref DataDeletionPolicy
    UpdateReplacePolicy: !Ref DataDeletionPolicy
    Properties:
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: garance:backup-plan
          Value: dynamo
        - Key: garance:cloudformation:stack-name
          Value: !Ref AWS::StackName

  DependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    DeletionPolicy: Delete
    Properties:
      CompatibleRuntimes:
        - !Ref NodeVersion
      ContentUri: ../dist/layer
      RetentionPolicy: Delete
      LayerName: !Sub ${AWS::StackName}-DependenciesLayer

  PokedexBadgeApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Ref ApiName
      StageName: !Ref ApiStageName
      TracingEnabled: true
      EndpointConfiguration:
        Type: REGIONAL
      Auth:
        Authorizers:
          CognitoM2MAuthorizer:
            UserPoolArn: !Sub '{{resolve:ssm:/pokedex-gauvain/${Env}/auth/user-pool-arn}}'
      Cors:
        AllowHeaders: !Sub "'${AllowedHeaders}'"
        AllowMethods: "'POST,GET,PUT,DELETE'"
        AllowOrigin: !Sub "'${AllowedOrigins}'"
        MaxAge: "'600'"
      GatewayResponses:
        UNAUTHORIZED:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
          ResponseTemplates:
            application/json: '{"message": $context.error.messageString}'
          StatusCode: '401'
      MethodSettings:
        - DataTraceEnabled: false
          HttpMethod: '*'
          LoggingLevel: INFO
          MetricsEnabled: true
          ResourcePath: /*
          ThrottlingBurstLimit: 200
          ThrottlingRateLimit: 100

  GetUserBadgeLambda:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - adapters/primary/serverless/get-user-badge.ts
        Minify: !Ref MinifyingEnabled
        Target: es2024
        Sourcemap: inline
        Format: esm
        OutExtension:
          - .js=.mjs
        External:
          - '@aws-sdk/*'
          - '@aws-lambda-powertools/*'
          - '@garance-retraite/*'
          - '@aws-smithy/*'
          - '@smithy/*'
          - 'aws-lambda'
          - 'inversify'
          - 'reflect-metadata'
          - 'zod'
    Properties:
      Handler: get-user-badge.handler
      Environment:
        Variables:
          POKEMON_TABLE_NAME: !Ref UserBadgeTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
              Resource:
                - !GetAtt UserBadgeTable.Arn
      Events:
        GetData:
          Type: Api
          Properties:
            RestApiId: !Ref PokedexBadgeApi
            Path: /users/{userId}/badges
            Method: GET
            Auth:
              Authorizer: CognitoM2MAuthorizer
              AuthorizationScopes:
                - api.pokedex.m2m/read

  GetUserBadgeLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${GetUserBadgeLambda}
      RetentionInDays: !Ref LambdaLogRetentionDays

  PostUserBadgeDecisionLambda:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - adapters/primary/serverless/post-user-badge-decision.ts
        Minify: !Ref MinifyingEnabled
        Target: es2024
        Sourcemap: inline
        Format: esm
        OutExtension:
          - .js=.mjs
        External:
          - '@aws-sdk/*'
          - '@aws-lambda-powertools/*'
          - '@garance-retraite/*'
          - '@aws-smithy/*'
          - '@smithy/*'
          - 'aws-lambda'
          - 'inversify'
          - 'reflect-metadata'
          - 'zod'
    Properties:
      Handler: post-user-badge-decision.handler
      Environment:
        Variables:
          POKEMON_TABLE_NAME: !Ref UserBadgeTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserBadgeTable
        - Statement:
            - Effect: Allow
              Action:
                - states:SendTaskSuccess
                - states:SendTaskFailure
              Resource: '*'
      Events:
        PostDecision:
          Type: Api
          Properties:
            RestApiId: !Ref PokedexBadgeApi
            Path: /users/{userId}/badges/{badgeId}/decision
            Method: POST
            Auth:
              Authorizer: CognitoM2MAuthorizer
              AuthorizationScopes:
                - api.pokedex.m2m/write

  PostUserBadgeDecisionLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${PostUserBadgeDecisionLambda}
      RetentionInDays: !Ref LambdaLogRetentionDays

  BadgeDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  BadgeDLQPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref BadgeDLQ
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt BadgeDLQ.Arn
            Condition:
              ArnLike:
                aws:SourceArn: !Sub 'arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/*'

  BadgeQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 90
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt BadgeDLQ.Arn
        maxReceiveCount: 3

  BadgeEventRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: !Sub '{{resolve:ssm:/pokedex-gauvain/${Env}/events/level-bus-name}}'
      EventPattern:
        source:
          - fr.pokemon.levels
        detail-type:
          - level.reached
      Targets:
        - Arn: !GetAtt BadgeQueue.Arn
          Id: 'BadgeQueueTarget'
          DeadLetterConfig:
            Arn: !GetAtt BadgeDLQ.Arn

  BadgeQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref BadgeQueue
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt BadgeQueue.Arn
            Condition:
              ArnLike:
                aws:SourceArn: !Sub 'arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/*'

  ProcessBadgeLambda:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - adapters/primary/serverless/consume-badge-event.ts
        Minify: !Ref MinifyingEnabled
        Target: es2024
        Sourcemap: inline
        Format: esm
        OutExtension:
          - .js=.mjs
        External:
          - '@aws-sdk/*'
          - '@aws-lambda-powertools/*'
          - '@garance-retraite/*'
          - '@aws-smithy/*'
          - '@smithy/*'
          - 'aws-lambda'
          - 'inversify'
          - 'reflect-metadata'
          - 'zod'
    Properties:
      Handler: consume-badge-event.handler
      Environment:
        Variables:
          POKEMON_TABLE_NAME: !Ref UserBadgeTable
          BADGE_STATE_MACHINE_ARN: !Ref BadgeApprovalStateMachine
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt UserBadgeTable.Arn
            - Effect: Allow
              Action:
                - states:StartExecution
              Resource:
                - !Ref BadgeApprovalStateMachine
      Events:
        SQSMessage:
          Type: SQS
          Properties:
            Queue: !GetAtt BadgeQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures

  ProcessBadgeLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProcessBadgeLambda}
      RetentionInDays: !Ref LambdaLogRetentionDays

  RegisterBadgeDecisionLambda:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - adapters/primary/serverless/register-badge-decision.ts
        Minify: !Ref MinifyingEnabled
        Target: es2024
        Sourcemap: inline
        Format: esm
        OutExtension:
          - .js=.mjs
        External:
          - '@aws-sdk/*'
          - '@aws-lambda-powertools/*'
          - '@garance-retraite/*'
          - '@aws-smithy/*'
          - '@smithy/*'
          - 'aws-lambda'
          - 'inversify'
          - 'reflect-metadata'
          - 'zod'
    Properties:
      Handler: register-badge-decision.handler
      Environment:
        Variables:
          POKEMON_TABLE_NAME: !Ref UserBadgeTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt UserBadgeTable.Arn

  RegisterBadgeDecisionLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${RegisterBadgeDecisionLambda}
      RetentionInDays: !Ref LambdaLogRetentionDays

  BadgeApprovalStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: STANDARD
      Tracing:
        Enabled: true
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref RegisterBadgeDecisionLambda
        - DynamoDBCrudPolicy:
            TableName: !Ref UserBadgeTable
      DefinitionSubstitutions:
        RegisterDecisionLambdaArn: !GetAtt RegisterBadgeDecisionLambda.Arn
        UserBadgeTableName: !Ref UserBadgeTable
      Definition:
        Comment: "Manual badge validation workflow"
        StartAt: RegisterDecision
        States:
          RegisterDecision:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke.waitForTaskToken
            TimeoutSeconds: 300
            Parameters:
              FunctionName: "${RegisterDecisionLambdaArn}"
              Payload:
                userId.$: "$.userId"
                badgeId.$: "$.badgeId"
                taskToken.$: "$$.Task.Token"
            ResultPath: "$.decisionResult"
            Catch:
              - ErrorEquals:
                  - States.Timeout
                ResultPath: "$.error"
                Next: ExpireBadge
            Next: EvaluateDecision

          EvaluateDecision:
            Type: Choice
            Choices:
              - Variable: "$.decisionResult.decision"
                StringEquals: GRANTED
                Next: GrantBadge
              - Variable: "$.decisionResult.decision"
                StringEquals: REFUSED
                Next: RefuseBadge
            Default: RefuseBadge

          GrantBadge:
            Type: Task
            Resource: arn:aws:states:::dynamodb:updateItem
            Parameters:
              TableName: "${UserBadgeTableName}"
              Key:
                pk:
                  S.$: "States.Format('USER#{}', $.userId)"
                sk:
                  S.$: "States.Format('BADGE#{}', $.badgeId)"
              UpdateExpression: "SET #status = :status, #reason = :reason, updatedAt = :updatedAt REMOVE taskToken"
              ExpressionAttributeNames:
                "#status": "status"
                "#reason": "reason"
              ExpressionAttributeValues:
                ":status":
                  S: "GRANTED"
                ":reason":
                  S.$: "$.decisionResult.reason"
                ":updatedAt":
                  S.$: "$$.State.EnteredTime"
            End: true

          RefuseBadge:
            Type: Task
            Resource: arn:aws:states:::dynamodb:updateItem
            Parameters:
              TableName: "${UserBadgeTableName}"
              Key:
                pk:
                  S.$: "States.Format('USER#{}', $.userId)"
                sk:
                  S.$: "States.Format('BADGE#{}', $.badgeId)"
              UpdateExpression: "SET #status = :status, #reason = :reason, updatedAt = :updatedAt REMOVE taskToken"
              ExpressionAttributeNames:
                "#status": "status"
                "#reason": "reason"
              ExpressionAttributeValues:
                ":status":
                  S: "REFUSED"
                ":reason":
                  S.$: "$.decisionResult.reason"
                ":updatedAt":
                  S.$: "$$.State.EnteredTime"
            End: true

          ExpireBadge:
            Type: Task
            Resource: arn:aws:states:::dynamodb:updateItem
            Parameters:
              TableName: "${UserBadgeTableName}"
              Key:
                pk:
                  S.$: "States.Format('USER#{}', $.userId)"
                sk:
                  S.$: "States.Format('BADGE#{}', $.badgeId)"
              UpdateExpression: "SET #status = :status, updatedAt = :updatedAt REMOVE taskToken"
              ExpressionAttributeNames:
                "#status": "status"
              ExpressionAttributeValues:
                ":status":
                  S: "EXPIRED"
                ":updatedAt":
                  S.$: "$$.State.EnteredTime"
            End: true

Outputs:
  PokedexBadgeApiExecuteUrl:
    Description: API execute URL
    Value: !Sub https://${PokedexBadgeApi}.execute-api.${AWS::Region}.amazonaws.com/${ApiStageName}
  BadgeApprovalStateMachineArn:
    Description: ARN de la State Machine de validation des badges
    Value: !Ref BadgeApprovalStateMachine

