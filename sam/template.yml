AWSTemplateFormatVersion: '2010-09-09'
Transform:
  - AWS::LanguageExtensions
  - AWS::Serverless-2016-10-31

Description: Stack pokedex-gauvain event.

Parameters:
  UserPoolArnParameter:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /pokedex-gauvain/auth/user-pool-arn
    Description: SSM Parameter path containing the Cognito User Pool ARN
  EventBusNameParameter:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /pokedex-gauvain/events/bus-name
    Description: SSM Parameter path containing the EventBus name
  DataDeletionPolicy:
    Type: String
    Description: Politique de suppression des données
    Default: Retain
    AllowedValues:
      - Retain
      - Delete
  AllowedHeaders:
    Type: String
    Default: 'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'
    Description: CORS allowed headers for API Gateway
  AllowedOrigins:
    Type: String
    Default: '*'
    Description: CORS allowed origins for API Gateway
  ApiName:
    Type: String
    Default: PokedexLevelApi
    Description: Name of the API Gateway REST API
  ApiStageName:
    Type: String
    Default: prod
    Description: Deployment stage name for API Gateway
  LoggerLevel:
    Description: Niveau de log applicatif des Lambdas
    Type: String
    Default: INFO
    AllowedValues:
      - DEBUG
      - INFO
      - WARN
      - ERROR
  MinifyingEnabled:
    Type: String
    Description: Enables minifying of Lambda code
    Default: 'true'
  NodeVersion:
    Type: String
    Description: Node.js version for all Lambda functions
    Default: nodejs24.x
    AllowedValues:
      - nodejs22.x
      - nodejs24.x

Globals:
  Function:
    Architectures: [arm64]
    CodeUri: ../src/
    Environment:
      Variables:
        ALLOWED_ORIGINS: !Ref AllowedOrigins
        AWS_NODEJS_CONNECTION_REUSE_ENABLED: 1
        NODE_OPTIONS: '--enable-source-maps'
    Handler: index.handler
    Layers: [!Ref DependenciesLayer]
    LoggingConfig:
      ApplicationLogLevel: !Ref LoggerLevel
      LogFormat: JSON
      SystemLogLevel: INFO
    Runtime: !Ref NodeVersion
    MemorySize: 512
    Timeout: 30
    Tracing: Active

Resources:
  UserLevelTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: !Ref DataDeletionPolicy
    UpdateReplacePolicy: !Ref DataDeletionPolicy
    Properties:
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: garance:backup-plan
          Value: dynamo
        - Key: garance:cloudformation:stack-name
          Value: !Ref AWS::StackName

  DependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    DeletionPolicy: Delete
    Properties:
      CompatibleRuntimes:
        - !Ref NodeVersion
      ContentUri: ../dist/layer
      RetentionPolicy: Delete
      LayerName: !Sub ${AWS::StackName}-DependenciesLayer

  PokedexLevelApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Ref ApiName
      StageName: !Ref ApiStageName
      TracingEnabled: true
      EndpointConfiguration:
        Type: REGIONAL
      Auth:
        Authorizers:
          CognitoM2MAuthorizer:
            UserPoolArn: !Ref UserPoolArnParameter
      Cors:
        AllowHeaders: !Sub "'${AllowedHeaders}'"
        AllowMethods: "'POST,GET,PUT,DELETE'"
        AllowOrigin: !Sub "'${AllowedOrigins}'"
        MaxAge: "'600'"
      GatewayResponses:
        UNAUTHORIZED:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
          ResponseTemplates:
            application/json: '{"message": $context.error.messageString}'
          StatusCode: '401'
      MethodSettings:
        - DataTraceEnabled: false
          HttpMethod: '*'
          LoggingLevel: INFO
          MetricsEnabled: true
          ResourcePath: /*
          ThrottlingBurstLimit: 200
          ThrottlingRateLimit: 100

  GetUserLevelLambda:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - adapters/primary/serverless/get-user-level.ts
        Minify: !Ref MinifyingEnabled
        Target: es2024
        Sourcemap: inline
        Format: esm
        OutExtension:
          - .js=.mjs
        External:
          - '@aws-sdk/*'
          - '@aws-lambda-powertools/*'
          - '@garance-retraite/*'
          - '@aws-smithy/*'
          - '@smithy/*'
          - 'aws-lambda'
          - 'inversify'
          - 'reflect-metadata'
          - 'zod'
    Properties:
      Handler: get-user-level.handler
      Environment:
        Variables:
          POKEMON_TABLE_NAME: !Ref UserLevelTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !GetAtt UserLevelTable.Arn
                - !Sub "${UserLevelTable.Arn}/index/*"
      Events:
        GetData:
          Type: Api
          Properties:
            RestApiId: !Ref PokedexLevelApi
            Path: /users/{userId}/level
            Method: GET
            Auth:
              Authorizer: CognitoM2MAuthorizer
              AuthorizationScopes:
                - api.pokedex.m2m/read

  PurchaseDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  PurchaseQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 90
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt PurchaseDLQ.Arn
        maxReceiveCount: 3

  PurchaseEventRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: !Ref EventBusNameParameter
      EventPattern:
        source:
          - fr.pokemon.referential
        detail-type:
          - purchase.completed
      Targets:
        - Arn: !GetAtt PurchaseQueue.Arn
          Id: "PurchaseQueueTarget"

  PurchaseQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref PurchaseQueue
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt PurchaseQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt PurchaseEventRule.Arn

  ProcessPurchaseLambda:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - adapters/primary/serverless/consume-purchase-event.ts
        Minify: !Ref MinifyingEnabled
        Target: es2024
        Sourcemap: inline
        Format: esm
        OutExtension:
          - .js=.mjs
        External:
          - '@aws-sdk/*'
          - '@aws-lambda-powertools/*'
          - '@garance-retraite/*'
          - '@aws-smithy/*'
          - '@smithy/*'
          - 'aws-lambda'
          - 'inversify'
          - 'reflect-metadata'
          - 'zod'
    Properties:
      Handler: consume-purchase-event.handler
      Environment:
        Variables:
          POKEMON_TABLE_NAME: !Ref UserLevelTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserLevelTable
      Events:
        SQSMessage:
          Type: SQS
          Properties:
            Queue: !GetAtt PurchaseQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures

Outputs:
  PokedexLevelApiExecuteUrl:
    Description: API execute URL
    Value: !Sub https://${PokedexLevelApi}.execute-api.${AWS::Region}.amazonaws.com/${ApiStageName}
